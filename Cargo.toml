[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "plotkit"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
description = "A matplotlib-shaped, publication-quality plotting library for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anonymousAAK/plotrs"
homepage = "https://plotkit.rs"
documentation = "https://docs.rs/plotkit"
readme = "README.md"
keywords = ["plotting", "chart", "visualization", "svg", "matplotlib"]
categories = ["visualization", "science", "multimedia::images"]

[dependencies]
plotkit-core = { path = "crates/plotkit-core", version = "0.2.1" }
plotkit-render-skia = { path = "crates/plotkit-render-skia", version = "0.2.1" }
plotkit-render-svg = { path = "crates/plotkit-render-svg", version = "0.2.1", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["png", "svg"]
png = []
svg = ["dep:plotkit-render-svg"]
jupyter = ["png", "dep:base64"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "01_line"
path = "examples/01_line.rs"

[[example]]
name = "02_scatter"
path = "examples/02_scatter.rs"

[[example]]
name = "03_bar"
path = "examples/03_bar.rs"

[[example]]
name = "04_histogram"
path = "examples/04_histogram.rs"

[[example]]
name = "05_fill_between"
path = "examples/05_fill_between.rs"

[[example]]
name = "06_errorbar"
path = "examples/06_errorbar.rs"

[[example]]
name = "07_boxplot"
path = "examples/07_boxplot.rs"

[[example]]
name = "08_step"
path = "examples/08_step.rs"

[[example]]
name = "09_stem"
path = "examples/09_stem.rs"

[[example]]
name = "10_heatmap"
path = "examples/10_heatmap.rs"

[[example]]
name = "11_colormap_scatter"
path = "examples/11_colormap_scatter.rs"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
criterion = { version = "0.5", features = ["html_reports"] }
plotkit-render-skia = { path = "crates/plotkit-render-skia", version = "0.2.1" }

[[bench]]
name = "render_benchmarks"
harness = false
