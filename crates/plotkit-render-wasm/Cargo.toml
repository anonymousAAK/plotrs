[package]
name = "plotkit-render-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "WASM Canvas2D rendering backend for plotkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anonymousAAK/plotrs"

[dependencies]
plotkit-core = { path = "../plotkit-core", version = "1.0.0" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "Document",
    "Window",
    "ImageData",
    "TextMetrics",
] }
js-sys = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
